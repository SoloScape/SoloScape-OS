<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SoloScape" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SoloScape Web Client</title>
  </head>
  <body>
    <main class="app">
      <section class="toolbar">
        <div>
          <strong>SoloScape Web Client</strong>
          <span id="revision"></span>
        </div>
        <div class="connect-row">
          <input id="gateway-url" aria-label="WebSocket gateway URL" />
          <button id="connect" type="button">Connect JS5</button>
        </div>
        <div id="status" role="status">Disconnected</div>
        <div class="login-row">
          <input id="login-username" autocomplete="username" placeholder="Username" aria-label="Game username" />
          <input id="login-password" autocomplete="current-password" type="password" placeholder="Password" aria-label="Game password" />
          <button id="login" type="button" disabled>Game login</button>
        </div>
        <div id="login-status" role="status">Game login waits for JS5 bootstrap</div>
      </section>

      <section class="viewport">
        <canvas id="game" width="765" height="503"></canvas>
      </section>

      <details class="debug">
        <summary>Transport log</summary>
        <pre id="log"></pre>
      </details>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
