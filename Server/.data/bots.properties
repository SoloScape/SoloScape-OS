# SoloScape world bot settings
# Edit this file and restart the game server to apply changes.
# Population settings specify a number of bots; use 0 to disable a mode.


# ===== GENERAL SETTINGS =====

# Turn the world-bot system on or off. false means no bots spawn.
enabled=true

# Allow bots to use members-only areas, activities and gear when true.
members=true


# ===== BOT POPULATION =====

# Number of bots doing everyday skills such as Woodcutting, Fishing and Mining.
skilling=300

# Number of bots that level up and change skills as they progress.
progressive=0

# Number of PvP bots roaming and fighting in the Wilderness.
wilderness=0

# Number of bots available for trading activities.
trade=0

# Number of bots participating in drop-party activities.
dropparty=0

# Number of bots assigned to the first PvP clan team.
clanone=0

# Number of bots assigned to the second PvP clan team.
clantwo=0

# Number of bots dedicated to regular combat activities.
combat=0


# ===== PVP BOT BEHAVIOUR =====

# PvP difficulty: mixed, novice, standard, veteran or elite.
pvp.difficulty=mixed

# Chance that Wilderness PK bots form a squad of 2-4 (0.0 to 1.0).
pvp.teams.chance=0.25

# Chance a nearby idle Wilderness bot offers to team with a real player (0.0 to 1.0).
pvp.player-team.chance=0.15


# ===== HUMAN-LIKE BEHAVIOUR =====

# Spawn skilling/progressive bots gradually on startup if true. Keep false to preserve
# existing bot identities and save files.
human.population.stagger-startup=false


# ===== PLAYER AND BOT HIGHSCORES =====

# Enable the read-only highscores page for both players and bots.
highscores.enabled=true

# Local web port for highscores (http://127.0.0.1:7072/highscores by default).
highscores.port=7072
