# Copied to .data/bots.properties when missing. Edit that file and restart the server.
# enabled controls startup population; each mode sets its bot count (0 disables it).
# pvp.difficulty applies to wilderness, clanone and clantwo: mixed/novice/standard/veteran/elite.
enabled=false
members=true
skilling=50
progressive=10
wilderness=30
trade=50
dropparty=20
clanone=20
clantwo=20
combat=0
pvp.difficulty=mixed
# Chance to start a Wilderness PK squad (2-4 bots); 0 disables, 1 always tries.
pvp.teams.chance=0.25
# Chance per nearby idle-bot encounter to offer a real Wilderness player "Team?".
pvp.player-team.chance=0.15
# Localhost-only live PvP bot map: http://127.0.0.1:7071/
debug.map.enabled=true
debug.map.port=7071

# Believable player routines and population. These affect skilling/progressive bots only.
# Existing bots retain their NPC/AI identity and native pathfinding/combat restrictions.
human.behaviour.enabled=true
human.routines.expanded=true
human.population.enabled=true
# Off by default so existing worldbot_N save files keep the same bot mode across restarts.
human.population.stagger-startup=false
