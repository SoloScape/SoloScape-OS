name: Forestry event checks

on:
  push:
    branches:
      - feature/forestry-events
    paths:
      - "Server/content/skills/woodcutting/**"
      - "tools/test_woodcutting.py"
      - ".github/workflows/forestry.yml"
  pull_request:
    paths:
      - "Server/content/skills/woodcutting/**"
      - "tools/test_woodcutting.py"
      - ".github/workflows/forestry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forestry:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache Kotlin compiler
        uses: actions/cache@v5
        with:
          path: .build-tools/kotlinc
          key: ${{ runner.os }}-kotlin-2.2.10
      - name: Prepare Kotlin compiler
        run: python -c "import sys; sys.path.insert(0, 'tools'); import build; build.compiler()"
      - name: Compile standalone server
        run: python tools/build.py Server
      - name: Run native Forestry and Woodcutting regression tests
        run: python tools/test_woodcutting.py
