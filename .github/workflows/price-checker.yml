name: Price checker checks

on:
  pull_request:
    paths:
      - "Server/content/interfaces/equipment/**"
      - ".github/workflows/price-checker.yml"

permissions:
  contents: read

jobs:
  price-checker:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache Kotlin compiler
        uses: actions/cache@v5
        with:
          path: .build-tools/kotlinc
          key: ${{ runner.os }}-kotlin-2.2.10
      - name: Prepare Kotlin compiler
        run: python -c "import sys; sys.path.insert(0, 'tools'); import build; build.compiler()"
      - name: Compile equipment module and verify price checker packet
        shell: pwsh
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP "price-checker-tests"
          New-Item -ItemType Directory -Force $testDir | Out-Null
          $libraries = @(Get-ChildItem "Server/server/app/build/install/app/lib" -Filter "*.jar" | Where-Object Name -NotLike "equipment-*" | ForEach-Object FullName)
          $classpath = $libraries -join [IO.Path]::PathSeparator
          $testJar = Join-Path $testDir "tests.jar"
          $sourceDirs = @(
              "Server/content/interfaces/equipment/src/main/kotlin",
              "Server/content/interfaces/equipment/src/test/kotlin"
          )
          $sources = @(Get-ChildItem $sourceDirs -Recurse -Filter "*.kt" | ForEach-Object FullName)
          $compilerLib = (Resolve-Path .build-tools/kotlinc/lib).Path
          $compilerArgs = @("-no-stdlib", "-no-reflect", "-jvm-target", "21", "-Xnested-type-aliases", "-opt-in=org.rsmod.annotations.InternalApi", "-classpath", $classpath, "-d", $testJar) + $sources
          $argFile = Join-Path $testDir "compiler.args"
          $compilerArgs | ForEach-Object { '"' + $_.Replace('\', '/').Replace('"', '\"') + '"' } | Set-Content -Encoding utf8NoBOM $argFile
          & "$env:JAVA_HOME/bin/java.exe" -Xmx2g -cp "$compilerLib/*" org.jetbrains.kotlin.cli.jvm.K2JVMCompiler "@$argFile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtimeClasspath = ($testJar, $classpath) -join [IO.Path]::PathSeparator
          $runArgs = @("-cp", $runtimeClasspath, "org.rsmod.content.interfaces.equipment.prices.GuidePricePacketCheckKt")
          $runArgFile = Join-Path $testDir "run.args"
          $runArgs | ForEach-Object { '"' + $_.Replace('\', '/').Replace('"', '\"') + '"' } | Set-Content -Encoding utf8NoBOM $runArgFile
          & "$env:JAVA_HOME/bin/java.exe" "@$runArgFile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
