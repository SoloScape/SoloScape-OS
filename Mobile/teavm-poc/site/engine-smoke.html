<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SoloScape | Original OpenOSRS engine</title>
<style>
:root{color-scheme:dark;background:#000}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;background:#000}
#original-engine-canvas{
    display:block;flex:none;
    width:min(100vw,152.0875dvh);
    height:min(100dvh,65.7516vw);
    max-width:100vw;max-height:100dvh;
    aspect-ratio:765/503;
    background:#000;border:0;outline:none;
    touch-action:none;overscroll-behavior:none;
}
#internal-diagnostics{display:none!important}
#loading-status{
    position:fixed;inset:auto 0 max(24px,env(safe-area-inset-bottom));
    text-align:center;padding:12px;color:#fff;
    font:14px system-ui,sans-serif;
    text-shadow:0 1px 3px #000;pointer-events:none;
}
#startup-error{
    position:fixed;inset:auto 0 0;padding:12px;
    color:#fff;background:#641e1e;text-align:center;
    font:14px system-ui,sans-serif;pointer-events:none;
}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="original-engine-canvas" width="765" height="503" tabindex="0"
    aria-label="SoloScape original RuneScape game"></canvas>
<div id="internal-diagnostics" hidden aria-hidden="true">
<input id="codebase" autocomplete="off">
<textarea id="params">{"1":"1","3":"false","4":"1","5":"0","6":"0","7":"0","8":"true","9":"ElZAIrq5NpKN6D3mDdihco3oPeYN2KFy2DCquj7JMmECPmLrDP3Bnw","10":"5","12":"301","14":"0","15":"0","16":"false","18":""}</textarea>
<textarea id="routes">[]</textarea>
<button id="start" type="button" tabindex="-1">Initialize original engine</button>
<strong id="status">Not started</strong>
<strong id="cycle">unavailable</strong>
<strong id="original-fps">unavailable</strong>
<strong id="presented-fps">unavailable</strong>
<strong id="cycle-rate">unavailable</strong>
<strong id="game-state">unavailable</strong>
<strong id="thread">unavailable</strong>
<strong id="frame">No</strong>
<p id="result">Not started</p>
<pre id="events"></pre>
</div>
<div id="loading-status" role="status" aria-live="polite">Starting SoloScape…</div>
<div id="startup-error" role="alert" hidden></div>
<script type="module" src="/engine-smoke.mjs"></script>
</body>
</html>
